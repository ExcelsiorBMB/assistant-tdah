<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Une chose à la fois</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #EFF1EA; --surface: #FFFFFF; --text: #232922; --text-soft: #5B6357;
    --accent: #B9793B; --accent-soft: #F1E3CC; --border: #DBE0D2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1C201A; --surface: #262B23; --text: #E9ECE3;
      --text-soft: #A2A896; --accent: #D9A464; --accent-soft: #3A2F1E; --border: #3A3F34;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: 'Inter', sans-serif; min-height: 100vh; display: flex; justify-content: center;
  }
  main { width: 100%; max-width: 620px; padding: 48px 24px 80px; }
  h1 {
    font-family: 'Fraunces', serif; font-weight: 500; font-size: clamp(28px, 5vw, 38px);
    margin: 0 0 6px; letter-spacing: -0.01em;
  }
  .sub { color: var(--text-soft); font-size: 15px; margin: 0 0 32px; max-width: 46ch; line-height: 1.5; }
  .capture { display: flex; gap: 8px; margin-bottom: 40px; }
  .capture input {
    flex: 1; padding: 14px 16px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text); font-size: 15px; font-family: 'Inter', sans-serif;
  }
  .capture input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .capture button {
    padding: 14px 20px; border-radius: 10px; border: none; background: var(--accent);
    color: var(--surface); font-weight: 600; font-size: 14px; cursor: pointer;
  }
  .capture button:hover { opacity: .9; }
  .section-label { font-size: 13px; color: var(--text-soft); margin: 0 0 14px; }
  .item {
    border: 1px solid var(--border); border-radius: 12px; background: var(--surface);
    padding: 16px 18px; margin-bottom: 12px;
  }
  .item-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .item-title { font-size: 15.5px; line-height: 1.4; }
  .item-title.done { text-decoration: line-through; color: var(--text-soft); }
  .item-actions { display: flex; gap: 8px; flex-shrink: 0; }
  .ghost-btn {
    background: none; border: 1px solid var(--border); color: var(--text-soft);
    padding: 7px 12px; border-radius: 8px; font-size: 13px; cursor: pointer; font-family: 'Inter', sans-serif;
  }
  .ghost-btn:hover { border-color: var(--accent); color: var(--accent); }
  .ghost-btn.primary { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
  .breakdown { margin-top: 16px; padding-top: 16px; border-top: 1px dashed var(--border); }
  .breakdown p { margin: 0 0 10px; font-size: 14px; color: var(--text-soft); }
  .steps { list-style: none; padding: 0; margin: 0 0 12px; }
  .steps li { display: flex; align-items: center; gap: 10px; font-size: 14.5px; padding: 6px 0; }
  .steps li .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }
  .step-input { display: flex; gap: 8px; }
  .step-input input {
    flex: 1; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text); font-size: 14px; font-family: 'Inter', sans-serif;
  }
  .empty { color: var(--text-soft); font-size: 14.5px; padding: 20px 0; }
</style>
</head>
<body>
<main>
  <h1>Une chose à la fois</h1>
  <p class="sub">Notez ce qui vous passe par la tête, sans réfléchir à l'organiser. On triera après.</p>

  <div class="capture">
    <input id="captureInput" type="text" placeholder="Ce qui vous vient en tête…" autocomplete="off">
    <button onclick="addItem()">Ajouter</button>
  </div>

  <p class="section-label">Vos captures</p>
  <div id="list"></div>
  <p id="emptyMsg" class="empty">Rien pour l'instant — écrivez quelque chose ci-dessus.</p>
</main>

<script>
  let items = [];
  let idCounter = 0;

  function addItem() {
    const input = document.getElementById('captureInput');
    const val = input.value.trim();
    if (!val) return;
    items.push({ id: idCounter++, title: val, steps: [], history: [], done: false, breakingDown: false });
    input.value = '';
    render();
  }

  document.getElementById('captureInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') addItem();
  });

  function toggleBreakdown(id) {
    items = items.map(it => it.id === id ? { ...it, breakingDown: !it.breakingDown } : it);
    render();
    const it = items.find(i => i.id === id);
    if (it && it.breakingDown && it.steps.length === 0 && !it.suggesting) {
      suggestSteps(id);
    }
  }

  // Appelle le petit serveur local (server/index.js), qui lui-même appelle l'API Claude.
  async function suggestSteps(id) {
    items = items.map(it => it.id === id ? { ...it, suggesting: true, suggestFailed: false } : it);
    render();
    try {
      const it = items.find(i => i.id === id);
      const res = await fetch('/api/suggest', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title: it.title, previous: it.history || [] }),
      });
      const data = await res.json();
      const suggested = Array.isArray(data.steps) ? data.steps.slice(0, 3) : [];
      items = items.map(i => i.id === id
        ? { ...i, steps: suggested, history: [...(i.history || []), ...suggested], suggesting: false, suggestFailed: suggested.length === 0 }
        : i);
    } catch (e) {
      items = items.map(i => i.id === id ? { ...i, suggesting: false, suggestFailed: true } : i);
    }
    render();
  }

  function addStep(id) {
    const input = document.getElementById('step-input-' + id);
    const val = input.value.trim();
    if (!val) return;
    items = items.map(it => it.id === id ? { ...it, steps: [...it.steps, val] } : it);
    render();
    document.getElementById('step-input-' + id).focus();
  }

  function removeStep(id, idx) {
    items = items.map(it => it.id === id ? { ...it, steps: it.steps.filter((_, i) => i !== idx) } : it);
    render();
  }

  function markDone(id) {
    items = items.map(it => it.id === id ? { ...it, done: !it.done } : it);
    render();
  }

  function removeItem(id) {
    items = items.filter(it => it.id !== id);
    render();
  }

  function render() {
    const list = document.getElementById('list');
    const emptyMsg = document.getElementById('emptyMsg');
    emptyMsg.style.display = items.length ? 'none' : 'block';
    list.innerHTML = items.map(it => `
      <div class="item">
        <div class="item-head">
          <div class="item-title ${it.done ? 'done' : ''}">${escapeHtml(it.title)}</div>
          <div class="item-actions">
            <button class="ghost-btn ${it.done ? '' : 'primary'}" onclick="markDone(${it.id})">${it.done ? 'Rouvrir' : 'Fait'}</button>
            <button class="ghost-btn" onclick="toggleBreakdown(${it.id})">${it.breakingDown ? 'Fermer' : 'Découper'}</button>
            <button class="ghost-btn" onclick="removeItem(${it.id})">×</button>
          </div>
        </div>
        ${it.breakingDown ? `
          <div class="breakdown">
            ${it.suggesting ? `<p>Réflexion sur les premières étapes…</p>` : `
              <p>${it.steps.length ? "Premières étapes suggérées — modifiez, supprimez ou ajoutez les vôtres :" : "Quelle est la toute première action concrète, faisable en moins de 10 minutes ?"}</p>
              ${it.suggestFailed ? `<p style="color:var(--accent);font-size:13px;">Suggestion indisponible — vérifiez que le serveur tourne et que la clé API est valide. Ajoutez vos étapes manuellement en attendant.</p>` : ''}
            `}
            <ul class="steps">
              ${it.steps.map((s, idx) => `<li><span class="dot"></span>${escapeHtml(s)}
                <button class="ghost-btn" style="padding:2px 8px;margin-left:auto;" onclick="removeStep(${it.id}, ${idx})">×</button></li>`).join('')}
            </ul>
            <div class="step-input">
              <input id="step-input-${it.id}" type="text" placeholder="Ajouter une étape…" autocomplete="off"
                onkeydown="if(event.key==='Enter') addStep(${it.id})">
              <button class="ghost-btn primary" onclick="addStep(${it.id})">Ajouter</button>
              <button class="ghost-btn" onclick="suggestSteps(${it.id})">Re-suggérer</button>
            </div>
          </div>
        ` : ''}
      </div>
    `).join('');
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  render();
</script>
</body>
</html>
